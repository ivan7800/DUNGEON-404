<!doctype html><html lang="es"><meta charset="utf-8"><title>DUNGEON 404 · verificación visual</title>
<style>body{background:#071113;color:#e2dcc6;font:14px system-ui;margin:16px}button,select{padding:10px;background:#1d3535;color:#e2dcc6;border:1px solid #738a7b;margin:4px;min-height:44px}iframe{display:block;width:100%;height:1060px;border:1px solid #a18e68;margin-top:12px}output{display:block;white-space:pre-wrap;padding:10px}label{margin:10px}</style>
<h1>Banco visual · La Catedral de la Marea</h1><p>Los escenarios de revisión son partidas aisladas. Este banco utiliza los motores y la interfaz reales.</p>
<label>Escenario <select id="preset"><option value="1">Cripta</option><option value="2">Biblioteca</option><option value="3">Laberinto</option><option value="4">Osario</option><option value="boss">Jefe · fase II</option></select></label><button id="prepare">Preparar escenario</button><button id="mobile">Anchura móvil · 390 px</button><button id="desktop">Anchura escritorio</button><button id="measure">Medir dibujo durante 5 segundos</button><output id="report" aria-live="polite">Sin medir.</output>
<iframe id="game" title="Juego bajo revisión"></iframe><script src="../engine.js"></script><script>
const frame=document.getElementById('game'),report=document.getElementById('report');
function prepare(){if(document.getElementById('prepare').disabled)return;document.getElementById('prepare').disabled=true;const choice=document.getElementById('preset').value,s=DungeonEngine.createGame();s.floor=choice==='boss'?1:Number(choice);s.visited=['1,1'];s.visitedByFloor[s.floor]=s.visited;
if(choice==='boss'){s.x=5;s.y=3;s.dir=1;const boss=s.monsters.find(m=>m.kind==='warden');s.monsters=s.monsters.filter(m=>m.floor!==1||m===boss);Object.assign(boss,{x:6,y:3,hp:20,telegraph:true,phaseAwakened:true});s.visited=['5,3'];s.visitedByFloor[1]=s.visited;}
const backup=localStorage.getItem(DungeonEngine.SAVE_KEY);localStorage.setItem(DungeonEngine.SAVE_KEY,JSON.stringify(s));frame.onload=()=>{try{frame.contentDocument.getElementById('load').click();}finally{if(backup===null)localStorage.removeItem(DungeonEngine.SAVE_KEY);else localStorage.setItem(DungeonEngine.SAVE_KEY,backup);}document.getElementById('prepare').disabled=false;report.textContent='Escenario preparado · '+choice+' · '+frame.contentDocument.getElementById('graphics-status').textContent;};frame.src='../index.html';}
document.getElementById('prepare').onclick=prepare;
document.getElementById('mobile').onclick=()=>frame.style.width='390px';document.getElementById('desktop').onclick=()=>frame.style.width='100%';
document.getElementById('measure').onclick=()=>{const start=frame.contentWindow.Dungeon404.performance();report.textContent='Midiendo 5 segundos…';setTimeout(()=>{const end=frame.contentWindow.Dungeon404.performance(),n=end.samples-start.samples,ms=end.totalMs-start.totalMs;report.textContent=JSON.stringify({backend:end.backend,samples:n,meanDrawMs:n?+(ms/n).toFixed(2):null,observedDrawHz:+(n/5).toFixed(1),note:'Tiempo CPU de dibujo y frecuencia observada en este navegador compartido; no es una medición de GPU ni de un equipo físico.'},null,2);},5000);};prepare();
</script></html>
