name: DUNGEON 404 - QA
on:
  push:
  pull_request:
jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax
        run: |
          node --check audio.js
          node --check engine.js
          node --check renderer.js
          node --check game.js
          node --check renderer3d.js
          node --check art-lab.js
          node --check glb-model.js
          node --check presentation.js
          node --check interface.js
          python3 -m py_compile launch.py
          bash -n INICIAR-LINUX.sh
      - name: Run functional checks
        run: |
          for test in tests/*.js; do
            node "$test"
          done
  browser-audit:
    timeout-minutes: 10
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          mkdir -p "$RUNNER_TEMP/dungeon404-qa"
          cd "$RUNNER_TEMP/dungeon404-qa"
          npm init --yes >/dev/null
          npm install --no-save --package-lock=false playwright@1.56.1
          test -x /usr/bin/google-chrome
      - name: Exercise real HTTP, controls and portable saves
        env:
          D404_EVIDENCE_DIR: ${{ runner.temp }}/dungeon404-evidence
          NODE_PATH: ${{ runner.temp }}/dungeon404-qa/node_modules
          D404_CHROMIUM_PATH: /usr/bin/google-chrome
          D404_REQUIRE_WEBGL: '1'
        run: node tests/browser-audit.cjs
      - name: Preserve browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dungeon404-browser-audit
          path: ${{ runner.temp }}/dungeon404-evidence
